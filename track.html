<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>التتبع المباشر للخدمة الميدانية | مكّن</title>
  <meta name="description" content="تتبع مباشر ومؤمن لموقع الفني الميداني ووقت الوصول التقريبي">
  <!-- Leaflet CSS for open-source interactive maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(8px);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: #10b981;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding: 1rem;
      gap: 1rem;
    }

    #map {
      width: 100%;
      height: 280px;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      overflow: hidden;
      background: #0b1120;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.25rem;
      border: 1px solid var(--border-color);
    }

    /* Stepper */
    .stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin-bottom: 1.5rem;
    }

    .stepper::before {
      content: '';
      position: absolute;
      top: 15px;
      right: 15px;
      left: 15px;
      height: 2px;
      background: var(--border-color);
      z-index: 1;
    }

    .step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .step-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s ease;
    }

    .step.active .step-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .step.completed .step-circle {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    .step.active {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ETA Grid */
    .eta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .eta-box {
      background: rgba(15, 23, 42, 0.6);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border-color);
    }

    .eta-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .eta-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .tech-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      margin-top: 1rem;
    }

    .tech-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .tech-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #059669, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .destination-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .error-card {
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .completed-card {
      text-align: center;
      padding: 2.5rem 1.5rem;
    }

    .completed-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>مكّن</span>
      <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: normal;">| تتبع الخدمة</span>
    </div>
    <div id="statusBadge" class="live-badge">
      <div class="live-dot"></div>
      <span id="badgeText">مباشر</span>
    </div>
  </header>

  <main id="mainContainer">
    <!-- Stepper -->
    <div class="card">
      <div class="stepper">
        <div class="step" id="stepAssigned">
          <div class="step-circle">1</div>
          <span>تم الإسناد</span>
        </div>
        <div class="step" id="stepEnRoute">
          <div class="step-circle">2</div>
          <span>في الطريق</span>
        </div>
        <div class="step" id="stepArrived">
          <div class="step-circle">3</div>
          <span>وصل للموقع</span>
        </div>
        <div class="step" id="stepCompleted">
          <div class="step-circle">4</div>
          <span>تم الإنجاز</span>
        </div>
      </div>

      <div class="destination-box">
        <span>📍</span>
        <div>
          <strong style="color: var(--text-main);">موقع تقديم الخدمة:</strong>
          <p id="customerAddressText">جاري تحميل العنوان...</p>
        </div>
      </div>
    </div>

    <!-- Live Map -->
    <div id="map"></div>

    <!-- ETA & Technician Info -->
    <div class="card" id="detailsCard">
      <div class="eta-grid">
        <div class="eta-box">
          <div class="eta-label">الوقت التقريبي للوصول (ETA)</div>
          <div class="eta-val" id="etaVal">-- دقيقة</div>
        </div>
        <div class="eta-box">
          <div class="eta-label">المسافة الحالية</div>
          <div class="eta-val" id="distVal">-- كم</div>
        </div>
      </div>

      <div class="tech-row">
        <div class="tech-info">
          <div class="tech-avatar" id="techAvatar">ف</div>
          <div>
            <div style="font-weight: 600;" id="techName">جاري التعيين...</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">فني معتمد ومفحوص</div>
          </div>
        </div>
        <div style="font-size: 0.8rem; color: var(--primary); font-weight: 600;" id="taskStatusText">
          في الطريق إليك
        </div>
      </div>
    </div>
  </main>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      const mainContainer = document.getElementById('mainContainer');
      const badgeText = document.getElementById('badgeText');
      const statusBadge = document.getElementById('statusBadge');
      const customerAddressText = document.getElementById('customerAddressText');
      const etaVal = document.getElementById('etaVal');
      const distVal = document.getElementById('distVal');
      const techName = document.getElementById('techName');
      const techAvatar = document.getElementById('techAvatar');
      const taskStatusText = document.getElementById('taskStatusText');

      const stepAssigned = document.getElementById('stepAssigned');
      const stepEnRoute = document.getElementById('stepEnRoute');
      const stepArrived = document.getElementById('stepArrived');
      const stepCompleted = document.getElementById('stepCompleted');

      if (!token) {
        showError('رابط التتبع غير صالح أو غير مكتمل. يرجى استخدام الرابط المستلم عبر الواتساب.');
        return;
      }

      let map = null;
      let techMarker = null;
      let customerMarker = null;
      let pollInterval = null;

      function initMap(lat, lng) {
        if (map) return;
        try {
          map = L.map('map', { zoomControl: false }).setView([lat, lng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
          }).addTo(map);
        } catch (e) {
          console.warn('Map initialization failed:', e);
        }
      }

      function updateStepper(status) {
        [stepAssigned, stepEnRoute, stepArrived, stepCompleted].forEach(s => {
          s.classList.remove('active', 'completed');
        });

        if (status === 'assigned') {
          stepAssigned.classList.add('active');
        } else if (status === 'en_route') {
          stepAssigned.classList.add('completed');
          stepEnRoute.classList.add('active');
        } else if (status === 'arrived' || status === 'in_progress') {
          stepAssigned.classList.add('completed');
          stepEnRoute.classList.add('completed');
          stepArrived.classList.add('active');
        } else if (status === 'completed') {
          stepAssigned.classList.add('completed');
          stepEnRoute.classList.add('completed');
          stepArrived.classList.add('completed');
          stepCompleted.classList.add('active');
        }
      }

      async function fetchTrackingStatus() {
        try {
          const res = await fetch(`/api/v1/dispatch?action=track-live&token=${encodeURIComponent(token)}`);
          const data = await res.json();

          if (!res.ok || !data.success) {
            showError(data.error || 'تعذر تحميل بيانات التتبع المباشر');
            if (pollInterval) clearInterval(pollInterval);
            return;
          }

          if (data.status === 'completed') {
            showCompleted(data.completedAt);
            if (pollInterval) clearInterval(pollInterval);
            return;
          }

          // Update UI
          updateStepper(data.status);
          customerAddressText.textContent = data.customerAddress || 'موقع العميل المحدد';
          techName.textContent = data.technicianName || 'الفني المختص';
          techAvatar.textContent = (data.technicianName || 'ف')[0];

          if (data.status === 'arrived' || data.status === 'in_progress') {
            taskStatusText.textContent = 'وصل الفني إلى موقعك';
            etaVal.textContent = 'وصل للموقع';
            distVal.textContent = '0 متر';
            badgeText.textContent = 'في الموقع';
          } else if (data.status === 'en_route') {
            taskStatusText.textContent = 'الفني في الطريق إليك';
            badgeText.textContent = 'مباشر';
            if (data.etaMinutes != null) {
              etaVal.textContent = data.etaMinutes <= 1 ? 'أقل من دقيقة' : `${data.etaMinutes} دقيقة`;
            }
            if (data.distanceMeters != null) {
              distVal.textContent = data.distanceMeters > 1000
                ? `${(data.distanceMeters / 1000).toFixed(1)} كم`
                : `${Math.round(data.distanceMeters)} متر`;
            }
          } else {
            taskStatusText.textContent = 'تم إسناد المهمة';
            etaVal.textContent = 'قريباً';
            distVal.textContent = '--';
          }

          // Map Marker updates
          const custLat = data.customerLat || 24.7136;
          const custLng = data.customerLng || 46.6753;
          initMap(custLat, custLng);

          if (map) {
            if (!customerMarker) {
              customerMarker = L.marker([custLat, custLng], {
                title: 'موقعك'
              }).addTo(map).bindPopup('📍 موقع تقديم الخدمة');
            }

            if (data.technicianLat && data.technicianLng) {
              if (!techMarker) {
                techMarker = L.marker([data.technicianLat, data.technicianLng], {
                  title: 'الفني'
                }).addTo(map).bindPopup('🚗 الفني المختص');
              } else {
                techMarker.setLatLng([data.technicianLat, data.technicianLng]);
              }

              // Fit bounds
              const group = new L.featureGroup([customerMarker, techMarker]);
              map.fitBounds(group.getBounds().pad(0.2));
            }
          }

        } catch (err) {
          console.warn('Tracking fetch error:', err);
        }
      }

      function showError(msg) {
        statusBadge.style.display = 'none';
        mainContainer.innerHTML = `
          <div class="card error-card">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🔒</div>
            <h2 style="font-size: 1.2rem; margin-bottom: 0.5rem; color: #f43f5e;">تعذر عرض التتبع</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; line-height: 1.5;">${msg}</p>
          </div>
        `;
      }

      function showCompleted(time) {
        statusBadge.innerHTML = '<span style="color: #10b981;">✓ مكتملة</span>';
        mainContainer.innerHTML = `
          <div class="card completed-card">
            <div class="completed-icon">🎉</div>
            <h2 style="font-size: 1.35rem; margin-bottom: 0.5rem; color: var(--primary);">تم إنجاز الخدمة بنجاح!</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
              شكراً لاختيارك منصتنا ونتمنى أن تكون الخدمة نالت رضاك التام.
            </p>
            <div style="background: rgba(15, 23, 42, 0.6); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted);">
              🔒 تم إغلاق رابط التتبع المباشر وإتلاف الإحداثيات لحماية خصوصيتك وفق نظام حماية البيانات الشخصية.
            </div>
          </div>
        `;
      }

      // Initial fetch + polling every 6 seconds
      fetchTrackingStatus();
      pollInterval = setInterval(fetchTrackingStatus, 6000);
    })();
  </script>
</body>
</html>
