<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحويل</title>
  <script>
    (function () {
      var host = (location.hostname || "").toLowerCase();
      if (host === "mken.live" || host === "www.mken.live" || /\.mken\.live$/.test(host)) {
        location.replace("/landing.html");
        return;
      }
      var stored = null;
      try { stored = localStorage.getItem("mken_theme_origin"); } catch (e) {}
      location.replace((stored || "http://localhost:3113") + "/");
    })();
  </script>
</head>
<body></body>
</html>
