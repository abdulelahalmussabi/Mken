<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/">
  <title>تحويل</title>
  <script>
    (function() {
      var stored = null;
      try { stored = localStorage.getItem('mken_theme_origin'); } catch(e) {}
      var base = stored || 'http://localhost:3113';
      window.location.replace(base + '');
    })();
  </script>
</head>
<body>
  <p>يتم التحويل... <a id="link">اضغط هنا</a></p>
  <script>
    var stored = null;
    try { stored = localStorage.getItem('mken_theme_origin'); } catch(e) {}
    var base = stored || 'http://localhost:3113';
    document.getElementById('link').href = base + '';
  </script>
</body>
</html>
