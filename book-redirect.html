<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/book">
  <title>تحويل إلى الحجز</title>
  <script>
    (function() {
      var stored = null;
      try { stored = localStorage.getItem('mken_theme_origin'); } catch(e) {}
      var base = stored || 'http://localhost:3113';
      var qs = location.search || '';
      window.location.replace(base.replace(/\/$/, '') + '/book' + qs);
    })();
  </script>
</head>
<body>
  <p>يتم التحويل إلى صفحة الحجز... <a id="link">اضغط هنا</a></p>
  <script>
    var stored = null;
    try { stored = localStorage.getItem('mken_theme_origin'); } catch(e) {}
    var base = stored || 'http://localhost:3113';
    document.getElementById('link').href = base.replace(/\/$/, '') + '/book' + (location.search || '');
  </script>
</body>
</html>
