name: Mken Platform Sovereign Gate & Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queue_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies (Root)
      run: npm install

    - name: Install dependencies (mkn)
      working-directory: mkn-theme
      run: npm install

    - name: Run Master Sovereign Quality & Regulatory Gate (10 Gates)
      run: node scripts/verify-master-gate.cjs

    - name: Run Queue Engine & Core Test Suite
      run: |
        node tests/queue-engine.test.cjs
        node tests/queue-shifts-hotswap.test.cjs
        node tests/queue-transfer-rbac.test.cjs
        node tests/queue-production-chaos.test.cjs
        node tests/queue-admin-auth.test.cjs
        node tests/queue-manual-override.test.cjs
        node tests/queue-zero-pii-display.test.cjs
        node tests/queue-dynamic-counters.test.cjs
        node tests/queue-prayer-onboarding.test.cjs
        node tests/queue-tenant-isolation.test.cjs
        node tests/queue-persistence-auth.test.cjs
        node tests/queue-optional-identity.test.cjs
        node tests/queue-concurrency.test.cjs
        node tests/queue-hall-policy.test.cjs

    - name: Prove legacy and queue URLs resolve in mkn
      run: node scripts/verify-api-routes.cjs
