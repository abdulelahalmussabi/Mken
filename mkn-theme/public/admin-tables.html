<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد ملصقات الطاولات الذكية | Mken Table QR Stand Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .page-break {
        page-break-after: always;
        break-after: page;
      }
      .table-card {
        box-shadow: none !important;
        border: 2px solid #000 !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
      }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">

  <!-- لوحة التحكم (تُخفى عند الطباعة) -->
  <div class="no-print max-w-5xl mx-auto bg-white rounded-2xl shadow-md p-6 mb-8 border border-gray-200">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-gray-100 pb-5 mb-6">
      <div>
        <h1 class="text-2xl font-black text-gray-900 flex items-center gap-2">
          🍽️ مولد ملصقات الطاولات الذكية (Dine-in QR Tables)
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          توليد وتخصيص ملصقات الطاولات مع ربط تذاكر الطابور التلقائي (المسار T) وطلبات الطعام
        </p>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md flex items-center gap-2 transition-all">
          🖨️ طباعة الملصقات المحددة
        </button>
      </div>
    </div>

    <!-- حقول الإعدادات -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-sm">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">المستأجر (Tenant):</label>
        <input type="text" id="tenantInput" value="cafe-chain" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">الفرع (Branch ID):</label>
        <select id="branchSelect" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="riyadh-01">فرع الرياض - العليا</option>
          <option value="jeddah-01">فرع جدة - الروضة</option>
          <option value="dammam-01">فرع الدمام - الشاطئ</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">اسم المنشأة بالملصق:</label>
        <input type="text" id="brandInput" value="مقاهي نجد المختصة" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">نطاق الطاولات (من - إلى):</label>
        <div class="flex items-center gap-2">
          <input type="number" id="tableStart" value="1" min="1" max="100" class="w-1/2 px-3 py-2 border rounded-lg text-center outline-none">
          <span class="text-gray-400">إلى</span>
          <input type="number" id="tableEnd" value="12" min="1" max="100" class="w-1/2 px-3 py-2 border rounded-lg text-center outline-none">
        </div>
      </div>
    </div>

    <div class="mt-4 flex justify-end">
      <button onclick="renderTableCards()" class="px-4 py-2 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-lg shadow transition-all">
        🔄 إعادة توليد البطاقات
      </button>
    </div>
  </div>

  <!-- منطقة عرض وطباعة بطاقات الطاولات -->
  <div id="cardsContainer" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
    <!-- يتم التوليد عبر الجافاسكريبت -->
  </div>

  <script>
    function generateTableUrl(tenant, branch, tableNum) {
      const origin = window.location.origin || 'https://mken.live';
      return `${origin}/?tenant=${encodeURIComponent(tenant)}&branch=${encodeURIComponent(branch)}&table=${encodeURIComponent(tableNum)}&service_type=dine_in&queue=T`;
    }

    function renderTableCards() {
      const tenant = document.getElementById('tenantInput').value.trim() || 'cafe-chain';
      const branch = document.getElementById('branchSelect').value;
      const brand = document.getElementById('brandInput').value.trim() || 'منشأة مكّن';
      const start = parseInt(document.getElementById('tableStart').value, 10) || 1;
      const end = parseInt(document.getElementById('tableEnd').value, 10) || 12;

      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      for (let i = start; i <= end; i++) {
        const orderUrl = generateTableUrl(tenant, branch, i);
        const cardId = `qr-table-${i}`;

        const card = document.createElement('div');
        card.className = 'table-card bg-white rounded-3xl border-2 border-gray-300 p-6 shadow-lg flex flex-col items-center justify-between text-center relative overflow-hidden transition-all';
        card.style.minHeight = '360px';

        card.innerHTML = `
          <!-- شريط علوي ملون -->
          <div class="w-full bg-amber-500 text-white text-xs font-bold py-1 px-3 rounded-full mb-3 flex items-center justify-center gap-1">
            <span>✨ خدمة الطاولات المباشرة (داين-إن)</span>
          </div>

          <!-- رأس البطاقة -->
          <div class="mb-2">
            <h3 class="text-sm font-bold text-gray-500 tracking-wide">${brand}</h3>
            <div class="text-3xl font-black text-gray-900 mt-1">طاولة رقم ${i}</div>
            <div class="text-[11px] text-gray-400">فرع: ${branch}</div>
          </div>

          <!-- حاوية رمز QR -->
          <div class="my-3 p-3 bg-white border-2 border-dashed border-gray-300 rounded-2xl flex items-center justify-center shadow-inner">
            <div id="${cardId}" class="w-[150px] h-[150px] flex items-center justify-center"></div>
          </div>

          <!-- إرشادات العميل -->
          <div class="mt-2 text-xs text-gray-600 space-y-1">
            <div class="font-bold text-gray-800">📲 امسح الرمز بكاميرا الجوال</div>
            <div class="text-[11px] text-gray-500">اختر وجبتك واستلم تذكرة الطابور T مباشرة على جوالك</div>
          </div>

          <!-- تذييل الملصق -->
          <div class="mt-4 pt-3 border-t border-gray-100 w-full flex justify-between items-center text-[10px] text-gray-400">
            <span>مدعوم بواسطة مكّن mken.live</span>
            <span>مسار الخدمة: T (طاولات)</span>
          </div>
        `;

        container.appendChild(card);

        // رسم كود QR باستخدام QRCode.js أو Fallback صورة
        setTimeout(() => {
          const qrTarget = document.getElementById(cardId);
          if (window.QRCode) {
            new QRCode(qrTarget, {
              text: orderUrl,
              width: 150,
              height: 150,
              colorDark: "#111827",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M
            });
          } else {
            qrTarget.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(orderUrl)}" alt="QR Code Table ${i}" class="w-full h-full object-contain">`;
          }
        }, 50);
      }
    }

    // التشغيل التلقائي عند التحميل
    window.addEventListener('DOMContentLoaded', renderTableCards);
  </script>
</body>
</html>
