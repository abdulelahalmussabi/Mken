<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحويل — بوابة المواعيد</title>
  <link rel="icon" type="image/png" href="assets/mken-logo.png">
  <script>
    (function() {
      function getOrigin() {
        var host = (location.hostname || "").toLowerCase();
        var nested = host.match(/^www\.([a-z0-9-]+)\.mken\.live$/);
        if (nested) return location.protocol + "//" + nested[1] + ".mken.live";
        try {
          var stored = localStorage.getItem("mken_theme_origin");
          if (stored) return stored.replace(/\/$/, "");
        } catch (e) {}
        return location.origin;
      }
      window.location.replace(getOrigin() + "/portal" + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>يتم التحويل إلى بوابة المواعيد... إذا لم يتم التحويل تلقائياً، <a id="link">اضغط هنا</a>.</p>
  <script>
    (function() {
      function getOrigin() {
        var host = (location.hostname || "").toLowerCase();
        var nested = host.match(/^www\.([a-z0-9-]+)\.mken\.live$/);
        if (nested) return location.protocol + "//" + nested[1] + ".mken.live";
        try {
          var stored = localStorage.getItem("mken_theme_origin");
          if (stored) return stored.replace(/\/$/, "");
        } catch (e) {}
        return location.origin;
      }
      document.getElementById("link").href = getOrigin() + "/portal" + location.search + location.hash;
    })();
  </script>
</body>
</html>
