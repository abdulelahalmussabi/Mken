<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحويل — تسجيل الدخول</title>
  <link rel="icon" type="image/png" href="assets/mken-logo.png">
  <script>
    // Bridge: old signup.html → mkn-theme /auth page
    // In production, change MKEN_THEME_ORIGIN to the deployed mkn-theme URL
    (function() {
      var origin = localStorage.getItem('mken_theme_origin') || 'http://localhost:3113';
      window.location.replace(origin + '/auth?tab=register');
    })();
  </script>
</head>
<body>
  <p>يتم التحويل إلى صفحة التسجيل... إذا لم يتم التحويل تلقائياً، <a id="link">اضغط هنا</a>.</p>
  <script>
    document.getElementById('link').href = (localStorage.getItem('mken_theme_origin') || 'http://localhost:3113') + '/auth?tab=register';
  </script>
</body>
</html>
