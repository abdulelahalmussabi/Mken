<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script src="js/theme-early.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري إكمال تسجيل الدخول... | مكّن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/platform.css">
  <link rel="icon" type="image/png" href="assets/mken-logo.png">
  <style>
    .callback-container {
      max-width: 500px;
      margin: 100px auto;
      padding: 30px;
      text-align: center;
      background: var(--color-background-card, #fff);
      border: 1px solid var(--color-border);
      border-radius: var(--radius, 12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .callback-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--color-primary, #2563eb);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <div class="callback-spinner"></div>
    <h2>جاري إكمال تسجيل الدخول...</h2>
    <p id="callbackStatus" class="admin-hint">يتم التحقق من بيانات حسابك وتوجيهك فوراً.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/services-store.js"></script>
  <script src="js/supabase-db.js"></script>
  <script src="js/mken-customer-auth.js"></script>
  <script>
    (function () {
      'use strict';
      var statusEl = document.getElementById('callbackStatus');

      function getRedirectTarget() {
        try {
          var target = localStorage.getItem('mken_auth_redirect_to');
          if (target) {
            localStorage.removeItem('mken_auth_redirect_to');
            return target;
          }
        } catch (e) {}

        var params = new URLSearchParams(window.location.search);
        var targetParam = params.get('redirect_to');
        if (targetParam) return targetParam;

        return 'portal.html';
      }

      function finishLogin() {
        if (statusEl) statusEl.textContent = 'تم تسجيل الدخول بنجاح! جاري تحويلك...';
        var target = getRedirectTarget();
        setTimeout(function () {
          window.location.replace(target);
        }, 600);
      }

      var db = window.MkenSupabaseDb;
      var client = db ? db.getClient() : null;

      if (client && client.auth) {
        client.auth.getSession().then(function (res) {
          if (res.data && res.data.session) {
            finishLogin();
          } else {
            client.auth.onAuthStateChange(function (event, session) {
              if (session) {
                finishLogin();
              }
            });
            setTimeout(finishLogin, 2000);
          }
        }).catch(function (err) {
          console.warn('OAuth callback error:', err);
          finishLogin();
        });
      } else {
        finishLogin();
      }
    })();
  </script>
</body>
</html>
