<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>مكّن | جاري التحويل</title>
  <script>
    (function () {
      // 1. التطهير الفوري الإجباري لعوامل الخدمة والكاش القديم من جهاز المستخدم
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
      } catch (e) {
        // Continue even if storage access fails
      }

      // 2. معالجة وتوجيه النطاقات للمحرك السحابي الحديث
      var host = (location.hostname || "").toLowerCase();
      var path = location.pathname || "/";
      var search = location.search || "";
      var hash = location.hash || "";

      // بوابات التراخيص
      if (host === "license.mken.live" || host === "licenses.mken.live") {
        location.replace("/pricing.html" + search + hash);
        return;
      }

      // النطاق الأساسي لمنصة مكّن
      if (host === "mken.live" || host === "www.mken.live") {
        if (path === "/" || path === "/index.html") {
          location.replace("/landing.html" + search + hash);
          return;
        }
      }

      // النطاقات الفرعية للمستأجرين (مثل saj.mken.live)
      if (host.indexOf(".mken.live") !== -1) {
        var parts = host.split(".");
        var candidate = parts[0];
        if (candidate === "www" && parts.length > 2) {
          candidate = parts[1];
        }
        if (candidate && candidate !== "mken" && candidate !== "license" && candidate !== "licenses" && candidate !== "admin") {
          // تحويل مباشر للمسار النظيف على المحرك الحديث
          location.replace("https://www.mken.live/" + encodeURIComponent(candidate) + search + hash);
          return;
        }
      }

      // السقوط التلقائي الآمن
      location.replace("/landing.html");
    })();
  </script>
</head>
<body style="background:#0a0d14; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <p style="font-size:14px; color:#94a3b8;">جاري توجيهك إلى المتجر...</p>
  </div>
</body>
</html>
